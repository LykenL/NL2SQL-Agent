name: data

on:
  push:
    branches: [main, v2-nextjs-fastapi]
  pull_request:
  workflow_dispatch:

env:
  BQ_PROJECT: woven-surface-511317-g0
  BQ_PREFIX: data_copilot_ci
  BQ_SOURCE_PREFIX: data_copilot_dev
  GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}

jobs:
  backend:
    name: pytest + dbt (syntax always, warehouse when the secret exists)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r backend-requirements.txt -r pipelines-requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: dbt parse (no warehouse needed)
        run: |
          cd dbt
          DBT_PROFILES_DIR=. dbt parse --target ci --no-partial-parse

      # Everything below only runs when the CI service-account secret is set.
      - name: Materialise the CI service-account key
        if: env.GCP_SA_JSON != ''
        run: printf '%s' "$GCP_SA_JSON" > /tmp/gcp-ci.json

      - name: dbt build against the CI datasets
        if: env.GCP_SA_JSON != ''
        env:
          GCP_SA_JSON_PATH: /tmp/gcp-ci.json
        run: |
          cd dbt
          DBT_PROFILES_DIR=. dbt build --target ci --fail-fast

      - name: Show dbt failures
        if: failure() && env.GCP_SA_JSON != ''
        run: |
          cd dbt
          tail -n 60 logs/dbt.log || true

  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci --silent

      # `next build` rather than bare tsc: Next generates LayoutProps/PageProps
      # types during the build, so a plain tsc run cannot see them.
      - name: Build (type checks included)
        run: cd frontend && npm run build
