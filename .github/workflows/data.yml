name: data

on:
  push:
    branches: [v2-nextjs-fastapi]   # the release branch, and what Render/Vercel build
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BQ_PROJECT: woven-surface-511317-g0
  BQ_PREFIX: data_copilot_ci
  BQ_SOURCE_PREFIX: data_copilot_dev
  GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}

jobs:
  backend:
    name: pytest + dbt (syntax always, warehouse when the secret exists)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend-requirements.txt
            pipelines-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r backend-requirements.txt -r pipelines-requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: dbt parse (no warehouse needed)
        run: |
          cd dbt
          DBT_PROFILES_DIR=. dbt parse --target ci --no-partial-parse

      # Everything below only runs when the CI service-account secret is set.
      - name: Materialise the CI service-account key
        if: env.GCP_SA_JSON != ''
        run: printf '%s' "$GCP_SA_JSON" > /tmp/gcp-ci.json

      - name: dbt build against the CI datasets
        if: env.GCP_SA_JSON != ''
        env:
          GCP_SA_JSON_PATH: /tmp/gcp-ci.json
        run: |
          cd dbt
          DBT_PROFILES_DIR=. dbt build --target ci --fail-fast

      - name: Show dbt failures
        if: failure() && env.GCP_SA_JSON != ''
        run: |
          cd dbt
          tail -n 60 logs/dbt.log || true

  lockfile:
    name: uv lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check requirements and pyproject agree
        run: python3 scripts/check_dependency_parity.py

      - name: Verify the manifest and lock
        run: uv lock --check

      - name: Check requirements.lock.txt is current
        run: uv export --frozen --no-hashes --no-dev --no-emit-project --no-header -o /tmp/requirements.lock.txt && diff -u requirements.lock.txt /tmp/requirements.lock.txt

      - name: Check requirements.pipelines.lock.txt is current
        run: uv export --frozen --no-hashes --no-dev --no-emit-project --no-header --extra pipelines -o /tmp/requirements.pipelines.lock.txt && diff -u requirements.pipelines.lock.txt /tmp/requirements.pipelines.lock.txt

      - name: Sync from the lockfile
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run --locked pytest tests -q

  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci --silent

      # `next build` rather than bare tsc: Next generates LayoutProps/PageProps
      # types during the build, so a plain tsc run cannot see them.
      - name: Build (type checks included)
        run: cd frontend && npm run build
